apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:         # makes the trace id in a log line a clickable link to the trace in Jaeger
        - name: trace_id
          matcherType: label # Loki stores trace_id as structured metadata
          matcherRegex: trace_id
          url: "${__value.raw}"
          datasourceUid: jaeger
